<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arma Reforger — Installed Mods</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c8a84b">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0c0f;
    --surface: #111418;
    --surface2:#161b22;
    --border:  #1e2530;
    --accent:  #c8a84b;
    --accent2: #e8c96a;
    --text:    #d4cfc6;
    --muted:   #5a6070;
    --online:  #4caf7d;
    --offline: #d64c4c;
    --warn:    #e0913a;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(200,168,75,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,168,75,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .layout { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 40px 24px 60px; }

  header {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .header-left .tag {
    font-size: 11px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
  }
  .header-left h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 38px;
    letter-spacing: 0.06em; color: #fff; line-height: 1;
  }
  .header-left h1 span { color: var(--accent); }
  .header-actions { display: flex; gap: 10px; }
  .btn-head {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 0.2em;
    text-transform: uppercase; padding: 8px 16px; cursor: pointer; text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-head:hover { border-color: var(--accent); color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); padding: 22px 26px; }
  .card-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }

  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .controls label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted);
  }
  select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-family: 'Barlow', sans-serif; font-size: 14px; padding: 9px 12px; outline: none; min-width: 220px;
  }
  select:focus { border-color: var(--accent); }
  select option { background: var(--surface); }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.18em; text-transform: uppercase; padding: 10px 18px; cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
  #ws-status { font-size: 12px; color: var(--muted); }

  .stats {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
  }
  .stat { background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; }
  .stat .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: #fff; }
  .stat .v small { font-family: 'Barlow', sans-serif; font-weight: 400; font-size: 12px; color: var(--muted); }
  .stat.custom .range { display: flex; align-items: center; gap: 6px; margin: 3px 0 2px; font-size: 12px; color: var(--muted); }
  .stat.custom input {
    width: 76px; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'Barlow', sans-serif; font-size: 13px; padding: 3px 6px; outline: none;
  }
  .stat.custom input:focus { border-color: var(--accent); }
  #missing { font-size: 12.5px; color: var(--warn); margin-bottom: 10px; overflow-wrap: anywhere; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 9.5px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  th.nosort { cursor: default; }
  th.sorted { color: var(--accent); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.mod-row:hover td { background: var(--surface2); }
  td.num { text-align: right; white-space: nowrap; }
  th.num { text-align: right; }
  .mono { font-family: 'Roboto Mono', monospace; font-size: 11.5px; }
  .nowrap { white-space: nowrap; }
  .name { color: #fff; font-weight: 500; }
  .muted { color: var(--muted); }
  .newer { color: var(--warn); font-size: 11px; }
  a.ws { color: var(--accent); text-decoration: none; white-space: nowrap; }
  a.ws:hover { text-decoration: underline; }
  .arrow {
    background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer;
    width: 26px; height: 24px; font-size: 11px; transition: transform 0.15s, color 0.15s, border-color 0.15s;
  }
  .arrow:hover { color: var(--accent); border-color: var(--accent); }
  .arrow.open { transform: rotate(180deg); color: var(--accent); }

  tr.details td { background: var(--bg); padding: 14px 18px 18px; }
  .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .details-grid h4 {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .dep { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .chip {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: 0.1em;
    padding: 0 5px; border: 1px solid currentColor; text-transform: uppercase;
  }
  .chip.direct   { color: var(--accent); }
  .chip.indirect { color: var(--muted); }
  .chip.missing  { color: var(--offline); }
  .chip.active   { color: var(--online); }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .details-foot { margin-top: 12px; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="layout">

  <header>
    <div class="header-left">
      <div class="tag">&#9632; Server Management Panel</div>
      <h1>INSTALLED <span>MODS</span></h1>
    </div>
    <div class="header-actions">
      <a class="btn-head" href="/">← Back to panel</a>
      <button class="btn-head" onclick="doLogout()">Logout ↗</button>
    </div>
  </header>

  <div class="card">
    <div class="controls">
      <label for="list-filter">Mod list</label>
      <select id="list-filter" onchange="render()"></select>
      <button class="btn-ghost" id="btn-refresh" onclick="refreshWorkshop()">Refresh workshop data</button>
      <span id="ws-status"></span>
    </div>
    <div class="stats">
      <div id="stats" style="display: contents"></div>
      <div class="stat custom">
        <div class="k">Custom range (MB, inclusive)</div>
        <div class="range">
          <input type="number" id="custom-min" min="0" step="any" placeholder="min" aria-label="Minimum size in MB" oninput="updateCustom()">
          –
          <input type="number" id="custom-max" min="0" step="any" placeholder="max" aria-label="Maximum size in MB" oninput="updateCustom()">
        </div>
        <div class="v" id="custom-v"></div>
      </div>
    </div>
    <div id="missing"></div>
    <div class="table-wrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"><tr><td class="empty" colspan="11">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

</div>
<script>
let DATA = null;            // last /api/mods/installed response
const open = new Set();     // GUIDs whose details are expanded
let sortKey = 'name', sortDir = 1;
let pollTimer = null;
let viewMods = [];          // mods in the table, for the custom size range

const COLUMNS = [
  { key: 'name',         label: 'Name' },
  { key: 'guid',         label: 'GUID' },
  { key: 'size',         label: 'Size', num: true },
  { key: 'version',      label: 'Version' },
  { key: 'created',      label: 'Created' },
  { key: 'updated',      label: 'Last modified' },
  { key: 'game_version', label: 'Game version' },
  { key: null,           label: '' },                       // workshop link
  { key: 'dependents',   label: 'Dependent mods', num: true },
  { key: null,           label: '' },                       // details arrow
];

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtBytes(b) {
  if (b == null) return '—';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (b >= 1024 && i < units.length - 1) { b /= 1024; i++; }
  return (i === 0 ? b.toFixed(0) : b.toFixed(b >= 100 ? 0 : b >= 10 ? 1 : 2)) + ' ' + units[i];
}

// Workshop dates may come as ISO strings or epoch seconds/milliseconds.
function toDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return new Date(v < 1e12 ? v * 1000 : v);
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function fmtDate(v) {
  const d = toDate(v);
  return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
}

function modName(guid) {
  return (DATA.names && DATA.names[guid]) || null;
}

// Mods in the current view (all installed, or those in the chosen list).
// Mods in the current view: all installed, or a list's mods plus everything
// they need (dependencies of dependencies included). pulledIn maps each mod
// that is only there as a dependency to the listed mods that need it.
function currentView() {
  const sel = document.getElementById('list-filter').value;
  if (!sel) return { mods: DATA.mods, missing: [], pulledIn: {}, listedCount: DATA.mods.length };
  const listed = DATA.modlists[sel] || [];
  const listedSet = new Set(listed);
  const byGuid = new Map(DATA.mods.map(m => [m.guid, m]));
  const pulledIn = {};
  listed.forEach(g => {
    const m = byGuid.get(g);
    // A listed mod that isn't installed has no addon.gproj to follow.
    if (!m) return;
    m.deps_all.forEach(d => {
      if (!listedSet.has(d)) (pulledIn[d] = pulledIn[d] || []).push(m.name);
    });
  });
  const all = [...listed, ...Object.keys(pulledIn)];
  return {
    mods: all.filter(g => byGuid.has(g)).map(g => byGuid.get(g)),
    missing: all.filter(g => !byGuid.has(g)),
    pulledIn,
    listedCount: listed.filter(g => byGuid.has(g)).length,
  };
}

function renderFilter() {
  const sel = document.getElementById('list-filter');
  const prev = sel.value;
  sel.innerHTML = '<option value="">Show all installed</option>' + Object.keys(DATA.modlists).map(n =>
    `<option value="${esc(n)}">${esc(n)}${n === DATA.selected ? ' (selected for server)' : ''}</option>`).join('');
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function renderHead() {
  document.getElementById('head').innerHTML = COLUMNS.map((c, i) => c.key
    ? `<th class="${c.num ? 'num ' : ''}${sortKey === c.key ? 'sorted' : ''}" data-i="${i}">${c.label}${sortKey === c.key ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`
    : '<th class="nosort"></th>').join('');
  document.querySelectorAll('#head th[data-i]').forEach(th => th.onclick = () => {
    const key = COLUMNS[th.dataset.i].key;
    if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
    render();
  });
}

function sortValue(m, key) {
  if (key === 'created' || key === 'updated') { const d = toDate(m[key]); return d ? d.getTime() : -Infinity; }
  if (key === 'size' || key === 'dependents') return m[key] ?? -Infinity;
  return String(m[key] ?? '').toLowerCase();
}

function render() {
  if (!DATA) return;
  renderHead();
  const view = currentView();

  // Dependents: mods in this view that need the mod, directly or indirectly.
  const dependents = {};
  view.mods.forEach(m => m.deps_all.forEach(g => (dependents[g] = dependents[g] || []).push(m.name)));
  const mods = view.mods.map(m => ({ ...m, dependents: (dependents[m.guid] || []).length, dependentNames: dependents[m.guid] || [] }));
  mods.sort((a, b) => {
    const x = sortValue(a, sortKey), y = sortValue(b, sortKey);
    return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
  });

  // Stats for the view.
  const GB = 1024 ** 3, MB100 = 100 * 1024 ** 2;
  const sum = list => list.reduce((t, m) => t + (m.size || 0), 0);
  const big = mods.filter(m => m.size > GB), mid = mods.filter(m => m.size >= MB100 && m.size <= GB), small = mods.filter(m => m.size < MB100);
  const stat = (k, v, n) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}${n != null ? ` <small>(${n} mod${n === 1 ? '' : 's'})</small>` : ''}</div></div>`;
  const depCount = mods.length - view.listedCount;
  document.getElementById('stats').innerHTML =
    stat('Mods', mods.length + (depCount ? ` <small>(${view.listedCount} listed + ${depCount} as ${depCount === 1 ? 'a dependency' : 'dependencies'})</small>` : '')) +
    stat('Total size', fmtBytes(sum(mods))) +
    stat('Above 1 GB', fmtBytes(sum(big)), big.length) +
    stat('100 MB – 1 GB', fmtBytes(sum(mid)), mid.length) +
    stat('Below 100 MB', fmtBytes(sum(small)), small.length);
  viewMods = mods;
  updateCustom();
  document.getElementById('missing').textContent = view.missing.length
    ? `${view.missing.length} mod${view.missing.length === 1 ? ' this list needs is' : 's this list needs are'} not installed: ` +
      view.missing.map(g => (modName(g) ? `${modName(g)} (${g})` : g) +
        (view.pulledIn[g] ? ` — dependency of ${view.pulledIn[g].join(', ')}` : '')).join('; ')
    : '';

  const rows = document.getElementById('rows');
  if (!mods.length) {
    rows.innerHTML = `<tr><td class="empty" colspan="${COLUMNS.length}">${DATA.mods.length ? 'No installed mods in this list.' : 'No installed mods found. Mods appear here once the server has downloaded them (set WORKSHOP_DIR in config.env if they live elsewhere).'}</td></tr>`;
    return;
  }
  const shown = new Set(mods.map(x => x.guid));
  rows.innerHTML = mods.map(m => {
    const newer = m.workshop_version && m.version && m.workshop_version !== m.version
      ? `<div class="newer">workshop: ${esc(m.workshop_version)}</div>` : '';
    const isOpen = open.has(m.guid);
    return `<tr class="mod-row">
      <td class="name">${esc(m.name)}${view.pulledIn[m.guid]
        ? ` <span class="chip indirect" title="Not in the list itself; needed by ${esc(view.pulledIn[m.guid].join(', '))}">dependency</span>` : ''}</td>
      <td class="mono">${esc(m.guid)}</td>
      <td class="num">${fmtBytes(m.size)}</td>
      <td class="nowrap">${esc(m.version || m.workshop_version || '—')}${newer}</td>
      <td class="nowrap">${fmtDate(m.created)}</td>
      <td class="nowrap">${fmtDate(m.updated)}</td>
      <td class="nowrap">${esc(m.game_version || '—')}</td>
      <td><a class="ws" href="${esc(DATA.workshop_url.replace('{guid}', m.guid))}" target="_blank" rel="noopener">workshop link</a></td>
      <td class="num" title="${esc(m.dependentNames.join(', '))}">${m.dependents}</td>
      <td><button class="arrow${isOpen ? ' open' : ''}" onclick="toggle('${m.guid}')" aria-label="Details">▼</button></td>
    </tr>` + (isOpen ? detailsRow(m, shown) : '');
  }).join('');
}

// `shown`: the GUIDs in the table right now. "Is required by" only lists those,
// so with a mod list selected it names the mods of that list (directly or as
// dependencies). "This mod requires" needs no filter: a mod's dependencies
// are always in the same view as the mod itself, apart from ones that aren't
// installed, which stay listed (marked) as a warning.
function detailsRow(m, shown) {
  const installed = new Map(DATA.mods.map(x => [x.guid, x]));
  // For an indirect dependency, name the dependencies that pull it in.
  const chain = [m, ...m.deps_all.map(g => installed.get(g)).filter(Boolean)];
  const deps = m.deps_all.length ? m.deps_all.map(g => {
    const direct = m.deps_direct.includes(g);
    const via = direct ? [] : chain.filter(x => x.deps_direct.includes(g)).map(x => x.name);
    return `<div class="dep">
      <span class="chip ${direct ? 'direct' : 'indirect'}">${direct ? 'direct' : 'indirect'}</span>
      <span>${esc(modName(g) || 'Unknown mod')}</span>
      <span class="mono muted">${g}</span>
      ${installed.has(g) ? '' : '<span class="chip missing">not installed</span>'}
      ${via.length ? `<span class="muted">via ${esc(via.join(', '))}</span>` : ''}
    </div>`;
  }).join('') : '<div class="empty">No dependencies.</div>';
  // Installed mods that list this one directly in their addon.gproj.
  const requiredBy = DATA.mods.filter(x => shown.has(x.guid) && x.deps_direct.includes(m.guid))
    .sort((a, b) => a.name.localeCompare(b.name));
  const dependents = requiredBy.length ? requiredBy.map(x => `<div class="dep">
      <span>${esc(x.name)}</span>
      <span class="mono muted">${x.guid}</span>
    </div>`).join('') : `<div class="empty">${document.getElementById('list-filter').value ? 'No mod in this list requires this one.' : 'No installed mod requires this one.'}</div>`;
  const lists = m.modlists.length ? m.modlists.map(n =>
    `<div class="dep"><span>${esc(n)}</span>${n === DATA.selected ? '<span class="chip active">selected for server</span>' : ''}</div>`).join('')
    : '<div class="empty">Not in any mod list.</div>';
  const foot = [`Folder: ${esc(m.path)}`];
  if (m.workshop_error) foot.push(`Workshop data unavailable: ${esc(m.workshop_error)}`);
  return `<tr class="details"><td colspan="${COLUMNS.length}">
    <div class="details-grid">
      <div><h4>This mod requires: (${m.deps_all.length})</h4>${deps}</div>
      <div><h4>Is required by: (${requiredBy.length})</h4>${dependents}</div>
      <div><h4>In mod lists (${m.modlists.length})</h4>${lists}</div>
    </div>
    <div class="details-foot">${foot.join('<br>')}</div>
  </td></tr>`;
}

// Total size of the mods in the table whose size lies within the custom
// range (MB, both ends inclusive; an empty field means no limit on that side).
// Sizes are compared in MB rounded to 2 decimals, so a mod shown as "100 MB"
// counts as 100 even if it is a few bytes over.
function updateCustom() {
  const MB = 1024 ** 2;
  const lo = parseFloat(document.getElementById('custom-min').value);
  const hi = parseFloat(document.getElementById('custom-max').value);
  const out = document.getElementById('custom-v');
  if (isNaN(lo) && isNaN(hi)) { out.innerHTML = '<small>enter a range</small>'; return; }
  if (!isNaN(lo) && !isNaN(hi) && lo > hi) { out.innerHTML = '<small>min is above max</small>'; return; }
  const mb = m => Math.round(m.size / MB * 100) / 100;
  const hits = viewMods.filter(m => m.size != null && (isNaN(lo) || mb(m) >= lo) && (isNaN(hi) || mb(m) <= hi));
  const total = hits.reduce((t, m) => t + m.size, 0);
  out.innerHTML = `${fmtBytes(total)} <small>(${hits.length} mod${hits.length === 1 ? '' : 's'})</small>`;
}

function toggle(guid) {
  if (open.has(guid)) open.delete(guid); else open.add(guid);
  render();
}

async function load() {
  try {
    const r = await fetch('/api/mods/installed');
    if (r.status === 401) { window.location.href = '/login'; return; }
    DATA = await r.json();
    renderFilter();
    render();
    const st = document.getElementById('ws-status');
    st.textContent = DATA.workshop_pending ? `Fetching workshop data for ${DATA.workshop_pending} mod${DATA.workshop_pending === 1 ? '' : 's'}…` : '';
    clearTimeout(pollTimer);
    if (DATA.workshop_pending) pollTimer = setTimeout(load, 3000);
  } catch (e) {
    document.getElementById('ws-status').textContent = 'Could not load the mod list';
  }
}

async function refreshWorkshop() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  try {
    const csrf = (await (await fetch('/api/csrf')).json()).csrf || '';
    await fetch('/api/mods/workshop-refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
      body: JSON.stringify({ _csrf: csrf }),
    });
    await load();
  } finally {
    btn.disabled = false;
  }
}

async function doLogout() {
  await fetch('/logout', { method: 'POST' });
  window.location.href = '/login';
}

load();
</script>
</body>
</html>
